[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-enterprise-publisher"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.40,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "httpx>=0.28,<1",
  "cryptography>=45,<46",
  "python-multipart>=0.0.20,<1",
  "openai>=1.100,<2",
  "sentence-transformers>=5.7,<6",
  "xlsxwriter>=3.2,<4",
  "pillow>=11.3,<12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
