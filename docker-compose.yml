services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ml_enterprise
      POSTGRES_USER: ml
      POSTGRES_PASSWORD: ml
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ml -d ml_enterprise"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ml:ml@postgres:5432/ml_enterprise
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ml:ml@postgres:5432/ml_enterprise
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    command: python -m app.worker

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads:
